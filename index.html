<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vampiro: A Máscara — Início</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:       #060608;
            --surface:  #0d0d11;
            --surface2: #13131a;
            --border:   #3a0000;
            --red:      #c0392b;
            --red-hi:   #e74c3c;
            --red-glow: rgba(192,57,43,0.4);
            --text:     #ccc8c0;
            --text-dim: #666;
            --mono:     'Share Tech Mono', monospace;
            --sans:     'Rajdhani', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at center, #1c0606 0%, var(--bg) 80%);
            color: var(--text);
            font-family: var(--sans);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 900px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .title-container {
            width: 100%;
            max-height: 55vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 50px;
            animation: fadeIn 1.8s ease-in-out;
        }

        .title-image {
            max-width: 100%;
            max-height: 55vh;
            object-fit: contain;
            filter: drop-shadow(0 0 20px var(--red-glow));
            transition: filter 0.5s ease, transform 0.5s ease;
        }

        .title-image:hover {
            filter: drop-shadow(0 0 30px rgba(231, 76, 60, 0.6));
            transform: scale(1.02);
        }

        .button-group {
            display: flex;
            flex-direction: row;
            gap: 30px;
            width: 100%;
            justify-content: center;
            animation: slideUp 1.2s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            font-family: var(--mono);
            font-size: 1.4rem;
            text-transform: uppercase;
            color: var(--text);
            background: var(--surface);
            border: 2px solid var(--border);
            padding: 16px 50px;
            min-width: 220px;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
            letter-spacing: 3px;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(231, 76, 60, 0.25), transparent);
            transition: all 0.5s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            color: #ffffff;
            border-color: var(--red-hi);
            background: var(--surface2);
            box-shadow: 0 0 25px var(--red-glow);
            transform: translateY(-4px);
        }

        .btn:active {
            transform: translateY(-1px);
            box-shadow: 0 0 12px var(--red-glow);
        }

        .btn-jogar {
            border-color: var(--red);
            box-shadow: 0 5px 15px rgba(192, 57, 43, 0.15);
        }
        
        .btn-jogar:hover {
            box-shadow: 0 0 25px rgba(192, 57, 43, 0.6);
            border-color: var(--red-hi);
        }

        .btn-compendio {
            border-color: #4a4a5a;
        }

        .btn-compendio:hover {
            box-shadow: 0 0 25px rgba(204, 200, 192, 0.2);
            border-color: var(--text);
        }

        /* Animações */
        @keyframes fadeIn {
            from { opacity: 0; filter: drop-shadow(0 0 0px transparent) blur(5px); }
            to { opacity: 1; filter: drop-shadow(0 0 20px var(--red-glow)) blur(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsividade para Telas Menores e Mobile */
        @media (max-width: 650px) {
            body {
                justify-content: flex-start;
                padding-top: 8vh;
            }

            .title-container {
                max-height: 45vh;
                margin-bottom: 40px;
            }

            .title-image {
                max-height: 45vh;
            }

            .button-group {
                flex-direction: column;
                align-items: center;
                gap: 20px;
                width: 100%;
            }

            .btn {
                width: 100%;
                max-width: 280px;
                padding: 18px 20px;
                font-size: 1.25rem;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Contêiner da imagem de título -->
        <div class="title-container">
            <!-- Caso a imagem local não carregue no canvas, mostra um fallback estilizado -->
            <img src="logo.webp" alt="Vampiro: A Máscara" class="title-image" onerror="this.onerror=null; this.src='https://placehold.co/800x400/060608/e74c3c?text=VAMPIRO:+A+MASCARA&font=Share+Tech+Mono';">
        </div>

        <!-- Grupo de Botões de Redirecionamento -->
        <div class="button-group">
            <a href="ficha.html" class="btn btn-jogar">Jogar</a>
            <a href="vtm_compendium.html" class="btn btn-compendio">Compêndio</a>
        </div>
    </div>

</body>
</html>
